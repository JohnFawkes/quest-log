<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <g transform="translate(-18,36)">
  <!-- Recurve Bow - grip at right hand (cy≈164) -->
  <!-- Bow limbs -->
  <path d="M155 102 Q170 167 155 227" stroke="#8B6914" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- Recurve tips -->
  <path d="M155 102 Q158 89 148 87" stroke="#8B6914" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M155 227 Q158 240 148 242" stroke="#8B6914" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Bowstring -->
  <line x1="148" y1="89" x2="148" y2="240" stroke="#F5F0E8" stroke-width="1.5"/>
  <!-- Handle grip wrap -->
  <rect x="146" y="157" width="18" height="14" fill="#5C3317" rx="2"/>
  <!-- Arrow (nocked, pointing right away from body) -->
  <line x1="148" y1="162" x2="184" y2="148" stroke="#8B6914" stroke-width="2"/>
  <!-- Arrow fletching (at string end) -->
  <path d="M148 162 L143 155 L149 159 M148 162 L143 167 L149 163" fill="#C0392B"/>
  <!-- Arrow tip (right end) -->
  <polygon points="184,148 177,145 177,151" fill="#A8B8C4"/>
  <!-- Bow decorative wrapping -->
  <rect x="153" y="127" width="6" height="5" fill="#C49A28" rx="1"/>
  <rect x="153" y="192" width="6" height="5" fill="#C49A28" rx="1"/>
  <!-- Wood grain on bow -->
  <path d="M158 127 Q164 157 160 189" stroke="#7A5C10" stroke-width="1.5" fill="none" opacity="0.4"/>
  </g>
</svg>
