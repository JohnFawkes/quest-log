<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <!-- Recurve Bow -->
  <!-- Bow limbs -->
  <path d="M155 75 Q170 140 155 200" stroke="#8B6914" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- Recurve tips -->
  <path d="M155 75 Q158 62 148 60" stroke="#8B6914" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M155 200 Q158 213 148 215" stroke="#8B6914" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Bowstring -->
  <line x1="148" y1="62" x2="148" y2="213" stroke="#F5F0E8" stroke-width="1.5"/>
  <!-- Handle grip wrap -->
  <rect x="146" y="130" width="18" height="14" fill="#5C3317" rx="2"/>
  <!-- Arrow (nocked) -->
  <line x1="148" y1="137" x2="120" y2="100" stroke="#8B6914" stroke-width="2"/>
