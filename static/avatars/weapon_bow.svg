  <path d="M120 100 L115 93 L122 96 M120 100 L116 96 L119 103" fill="#C0392B"/>
  <!-- Arrow tip -->
  <polygon points="148,137 152,130 154,138" fill="#A8B8C4"/>
  <!-- Bow decorative wrapping -->
  <rect x="153" y="100" width="6" height="5" fill="#C49A28" rx="1"/>
  <rect x="153" y="165" width="6" height="5" fill="#C49A28" rx="1"/>
  <!-- Wood grain on bow -->
  <path d="M158 100 Q164 130 160 162" stroke="#7A5C10" stroke-width="1.5" fill="none" opacity="0.4"/>
</svg>
