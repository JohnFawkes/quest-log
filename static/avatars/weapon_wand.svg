<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <g transform="translate(0,36)">
  <!-- Magic Wand - straight vertical, grip at right hand (cy≈164) -->
  <!-- Wand shaft (slim dark wood) -->
  <rect x="143" y="46" width="6" height="154" fill="#3B2A1A" rx="3"/>
  <!-- Shaft highlight -->
  <rect x="147" y="48" width="2" height="150" fill="#6B4226" rx="1" opacity="0.6"/>
  <!-- Wand star tip (6-pointed, centred at top of shaft) -->
  <path d="M146,46 L143,35 L146,46 L135,41 L146,46 L141,56 L146,46 L157,41 L146,46 L151,56 L146,46 L149,35 Z" fill="#FFD700"/>
  <!-- Star glow -->
  <circle cx="146" cy="43" r="12" fill="#FFD700" opacity="0.22"/>
  <circle cx="146" cy="43" r="7" fill="#FFD700" opacity="0.28"/>
  <!-- Sparkles (all to the right of the body, x>150) -->
  <circle cx="158" cy="25" r="2.5" fill="#FFD700" opacity="0.7"/>
  <circle cx="162" cy="48" r="2" fill="#C39FE8" opacity="0.8"/>
  <circle cx="168" cy="18" r="2" fill="#E8D44D" opacity="0.7"/>
  <circle cx="172" cy="34" r="2.5" fill="#FFD700" opacity="0.6"/>
  <circle cx="170" cy="52" r="2" fill="#C39FE8" opacity="0.7"/>
  <path d="M155 22 L162 16" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>
  <path d="M170 30 L175 24" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>
  <!-- Decorative gem band (midpoint of shaft) -->
  <rect x="139" y="110" width="14" height="8" fill="#9B59B6" rx="2"/>
  <circle cx="146" cy="114" r="3" fill="#C39FE8" opacity="0.8"/>
  <!-- Grip -->
  <rect x="140" y="152" width="12" height="44" fill="#5C3317" rx="3"/>
  <!-- Pommel -->
  <ellipse cx="146" cy="200" rx="9" ry="7" fill="#9B59B6"/>
  <circle cx="146" cy="200" r="3.5" fill="#C39FE8"/>
  </g>
</svg>
