  <rect x="150" y="145" width="12" height="8" fill="#3B2A1A"/>
  <rect x="150" y="161" width="12" height="8" fill="#3B2A1A"/>
  <rect x="150" y="177" width="12" height="8" fill="#3B2A1A"/>
  <!-- Axe head top -->
  <path d="M156 55 Q167 30 180 25 Q185 40 175 53 Q167 59 156 59" fill="#8B9DA8"/>
  <!-- Axe head bottom -->
  <path d="M156 59 Q167 70 180 75 Q175 90 167 83 Q159 77 156 63" fill="#8B9DA8"/>
