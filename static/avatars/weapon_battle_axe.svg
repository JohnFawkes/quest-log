<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <g transform="translate(0,36)">
  <!-- Battle Axe - grip at right hand (cy≈164) -->
  <!-- Handle -->
  <rect x="145" y="55" width="12" height="200" fill="#5C3317" rx="4"/>
  <!-- Handle grip -->
  <rect x="145" y="145" width="12" height="8" fill="#3B2A1A"/>
  <rect x="145" y="161" width="12" height="8" fill="#3B2A1A"/>
  <rect x="145" y="177" width="12" height="8" fill="#3B2A1A"/>
  <!-- Axe head top -->
  <path d="M151 55 Q162 30 175 25 Q180 40 170 53 Q162 59 151 59" fill="#8B9DA8"/>
  <!-- Axe head bottom -->
  <path d="M151 59 Q162 70 175 75 Q170 90 162 83 Q154 77 151 63" fill="#8B9DA8"/>
