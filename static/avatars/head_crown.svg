<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <!-- Royal Crown - sits on top of head, band at forehead level -->
  <!-- Crown band -->
  <rect x="76" y="4" width="48" height="12" fill="#FFD700" rx="2"/>
  <!-- Crown points (extend upward from band, tips clip above canvas) -->
  <polygon points="76,4 84,-14 92,4" fill="#FFD700"/>
  <polygon points="92,4 100,-16 108,4" fill="#FFD700"/>
  <polygon points="108,4 116,-14 124,4" fill="#FFD700"/>
  <!-- Gem on center point -->
  <ellipse cx="100" cy="-12" rx="4" ry="5" fill="#E74C3C"/>
  <ellipse cx="100" cy="-13" rx="2" ry="2" fill="#FF8080" opacity="0.7"/>
  <!-- Gems on side points -->
  <ellipse cx="84" cy="-9" rx="3" ry="3.5" fill="#2980B9"/>
  <ellipse cx="116" cy="-9" rx="3" ry="3.5" fill="#27AE60"/>
  <!-- Band decoration -->
  <line x1="76" y1="12" x2="124" y2="12" stroke="#B8860B" stroke-width="1.5"/>
  <!-- Pearls on band -->
  <circle cx="84" cy="12" r="2.5" fill="#F5F0E8"/>
  <circle cx="92" cy="12" r="2.5" fill="#F5F0E8"/>
  <circle cx="100" cy="12" r="2.5" fill="#F5F0E8"/>
  <circle cx="108" cy="12" r="2.5" fill="#F5F0E8"/>
  <circle cx="116" cy="12" r="2.5" fill="#F5F0E8"/>
  <!-- Crown gold sheen -->
  <path d="M78 6 L122 6" stroke="#FFF3AA" stroke-width="1.5" opacity="0.5"/>
</svg>
