<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <g transform="translate(0,36)">
  <!-- Open Spellbook - shifted 20px up so hand grips book centre -->
  <!-- Book spine -->
  <rect x="44" y="128" width="10" height="70" fill="#3B1F8C" rx="2"/>
  <!-- Left page -->
  <path d="M44 128 L10 132 L10 198 L44 198 Z" fill="#F5F0E8"/>
  <!-- Right page -->
  <path d="M54 128 L88 132 L88 198 L54 198 Z" fill="#F0EBE0"/>
  <!-- Page edge shadows -->
  <path d="M44 128 L10 132" stroke="#CCC5B5" stroke-width="1"/>
  <path d="M44 198 L10 198" stroke="#CCC5B5" stroke-width="1"/>
  <path d="M54 128 L88 132" stroke="#CCC5B5" stroke-width="1"/>
  <!-- Book cover (top/bottom) -->
  <rect x="10" y="128" width="78" height="6" fill="#2C1670" rx="1"/>
  <rect x="10" y="198" width="78" height="6" fill="#2C1670" rx="1"/>
  <!-- Magic text/runes on left page -->
  <line x1="14" y1="142" x2="42" y2="142" stroke="#2C1670" stroke-width="1.5" opacity="0.7"/>
  <line x1="14" y1="150" x2="40" y2="150" stroke="#2C1670" stroke-width="1.5" opacity="0.7"/>
  <line x1="14" y1="158" x2="42" y2="158" stroke="#2C1670" stroke-width="1.5" opacity="0.7"/>
  <line x1="14" y1="166" x2="38" y2="166" stroke="#2C1670" stroke-width="1.5" opacity="0.7"/>
  <line x1="14" y1="174" x2="42" y2="174" stroke="#2C1670" stroke-width="1.5" opacity="0.7"/>
  <line x1="14" y1="182" x2="36" y2="182" stroke="#2C1670" stroke-width="1.5" opacity="0.7"/>
  <!-- Magic diagram on right page (pentagram) -->
  <circle cx="71" cy="164" r="22" fill="none" stroke="#9B59B6" stroke-width="1"/>
  <path d="M71 142 L63 164 L82 150 L60 150 L79 164 Z" fill="none" stroke="#9B59B6" stroke-width="1.5"/>
  <!-- Glowing runes -->
  <text x="58" y="160" font-size="8" fill="#6B2D8B" opacity="0.8">✦</text>
  <text x="74" y="180" font-size="7" fill="#9B59B6" opacity="0.7">✦</text>
  <!-- Gold clasp/bookmark -->
  <rect x="48" y="190" width="12" height="14" fill="#C49A28" rx="1"/>
  <circle cx="54" cy="197" r="3" fill="#8B6914"/>
  <!-- Page glow -->
  <circle cx="71" cy="164" r="10" fill="#9B59B6" opacity="0.08"/>
  </g>
</svg>
