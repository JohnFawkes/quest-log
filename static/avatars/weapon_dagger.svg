  <circle cx="166" cy="145" r="4" fill="#E74C3C"/>
  <!-- Grip -->
  <rect x="144" y="149" width="14" height="36" fill="#3B2A1A" rx="3"/>
  <!-- Grip wrapping (gold thread) -->
  <path d="M144 153 Q151 151 158 153 M144 159 Q151 157 158 159 M144 165 Q151 163 158 165 M144 171 Q151 169 158 171 M144 177 Q151 175 158 177" stroke="#C49A28" stroke-width="1.5" fill="none"/>
  <!-- Pommel -->
