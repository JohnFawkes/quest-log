<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <g transform="translate(0,36)">
  <!-- Holy Light Aura -->
  <!-- Halo above head -->
  <ellipse cx="100" cy="10" rx="28" ry="7" fill="none" stroke="#FFD700" stroke-width="4" opacity="0.9"/>
  <ellipse cx="100" cy="10" rx="28" ry="7" fill="none" stroke="#FFF8DC" stroke-width="2" opacity="0.6"/>
  <!-- Halo shimmer -->
  <ellipse cx="100" cy="8" rx="20" ry="4" fill="none" stroke="#FFFAAA" stroke-width="1.5" opacity="0.5"/>
  <!-- Light rays radiating outward from top -->
  <line x1="100" y1="3" x2="100" y2="-10" stroke="#FFD700" stroke-width="2" opacity="0.4"/>
  <line x1="115" y1="6" x2="126" y2="-2" stroke="#FFD700" stroke-width="2" opacity="0.4"/>
  <line x1="85" y1="6" x2="74" y2="-2" stroke="#FFD700" stroke-width="2" opacity="0.4"/>
  <line x1="128" y1="10" x2="142" y2="10" stroke="#FFD700" stroke-width="2" opacity="0.3"/>
  <line x1="72" y1="10" x2="58" y2="10" stroke="#FFD700" stroke-width="2" opacity="0.3"/>
  <!-- Soft body glow (golden) -->
  <ellipse cx="100" cy="155" rx="55" ry="115" fill="#FFD700" opacity="0.04"/>
  <!-- Golden motes floating around figure -->
  <circle cx="68" cy="120" r="3" fill="#FFD700" opacity="0.6"/>
  <circle cx="135" cy="110" r="2.5" fill="#FFD700" opacity="0.5"/>
  <circle cx="62" cy="180" r="2.5" fill="#FFF8DC" opacity="0.6"/>
  <circle cx="140" cy="175" r="3" fill="#FFD700" opacity="0.5"/>
  <circle cx="72" cy="240" r="2" fill="#FFD700" opacity="0.4"/>
  <circle cx="130" cy="235" r="2.5" fill="#FFF8DC" opacity="0.5"/>
  <circle cx="88" cy="90" r="2" fill="#FFD700" opacity="0.5"/>
  <circle cx="114" cy="95" r="2" fill="#FFF8DC" opacity="0.5"/>
  <!-- Ground holy light pool -->
  <ellipse cx="100" cy="272" rx="46" ry="9" fill="#FFD700" opacity="0.18"/>
  <!-- Cross of light at feet -->
  <line x1="100" y1="260" x2="100" y2="284" stroke="#FFD700" stroke-width="2" opacity="0.5"/>
  <line x1="88" y1="272" x2="112" y2="272" stroke="#FFD700" stroke-width="2" opacity="0.5"/>
  </g>
</svg>
