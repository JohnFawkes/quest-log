<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <g transform="translate(-20,36)">
  <!-- Wizard Staff - shifted 5px right to clear body arm (right arm edge x=146) -->
  <!-- Staff shaft -->
  <rect x="151" y="40" width="10" height="220" fill="#6B4226" rx="5"/>
  <!-- Wood grain -->
  <line x1="154" y1="50" x2="158" y2="70" stroke="#5A3318" stroke-width="1" opacity="0.6"/>
  <line x1="153" y1="90" x2="159" y2="115" stroke="#5A3318" stroke-width="1" opacity="0.6"/>
  <line x1="154" y1="140" x2="157" y2="165" stroke="#5A3318" stroke-width="1" opacity="0.6"/>
  <!-- Staff top mount -->
  <rect x="148" y="32" width="16" height="12" fill="#C49A28" rx="2"/>
  <!-- Crystal orb -->
  <circle cx="156" cy="15" r="22" fill="#9B59B6" opacity="0.8"/>
  <circle cx="156" cy="15" r="18" fill="#8B2FBF" opacity="0.6"/>
  <!-- Crystal facets -->
  <polygon points="156,-5 168,15 156,30 144,15" fill="#C39FE8" opacity="0.4"/>
  <!-- Crystal glow -->
  <circle cx="150" cy="8" r="7" fill="#E0C8F8" opacity="0.6"/>
  <circle cx="148" cy="6" r="4" fill="white" opacity="0.5"/>
  <!-- Orb magical glow -->
  <circle cx="156" cy="15" r="26" fill="none" stroke="#C39FE8" stroke-width="2" opacity="0.3"/>
  <circle cx="156" cy="15" r="30" fill="none" stroke="#9B59B6" stroke-width="1" opacity="0.2"/>
  <!-- Staff tip (bottom, near feet) -->
  <polygon points="151,260 161,260 156,276" fill="#C49A28"/>
  <!-- Staff rings decorative (grip area) -->
  <rect x="149" y="110" width="14" height="6" fill="#C49A28" rx="1"/>
  <rect x="149" y="160" width="14" height="6" fill="#C49A28" rx="1"/>
  </g>
</svg>
