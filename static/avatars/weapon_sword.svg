<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <!-- Short Sword - starter (right hand, angled) -->
  <!-- Blade -->
  <path d="M148 260 L138 100" stroke="#C0CDD3" stroke-width="7" stroke-linecap="round"/>
  <!-- Blade edge highlight -->
  <path d="M150 258 L140 102" stroke="#E8F0F5" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Blade tip -->
  <polygon points="138,100 134,110 142,110" fill="#A8B8C4"/>
  <!-- Crossguard -->
  <rect x="128" y="198" width="32" height="8" fill="#C49A28" rx="2"/>
  <!-- Crossguard detail -->
  <circle cx="128" cy="202" r="4" fill="#A07820"/>
  <circle cx="160" cy="202" r="4" fill="#A07820"/>
  <!-- Grip -->
  <rect x="140" y="206" width="12" height="44" fill="#5C3317" rx="3"/>
  <!-- Grip wrap -->
  <line x1="140" y1="216" x2="152" y2="216" stroke="#3B2A1A" stroke-width="2"/>
  <line x1="140" y1="224" x2="152" y2="224" stroke="#3B2A1A" stroke-width="2"/>
  <line x1="140" y1="232" x2="152" y2="232" stroke="#3B2A1A" stroke-width="2"/>
  <line x1="140" y1="240" x2="152" y2="240" stroke="#3B2A1A" stroke-width="2"/>
  <!-- Pommel -->
  <circle cx="146" cy="252" r="8" fill="#C49A28"/>
  <circle cx="146" cy="252" r="4" fill="#8B6914"/>
</svg>
