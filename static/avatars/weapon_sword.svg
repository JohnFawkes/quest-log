<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <!-- Short Sword - grip centred at right hand (cy≈164) -->
  <!-- Blade -->
  <path d="M148 196 L138 36" stroke="#C0CDD3" stroke-width="7" stroke-linecap="round"/>
  <!-- Blade edge highlight -->
  <path d="M150 194 L140 38" stroke="#E8F0F5" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Blade tip -->
  <polygon points="138,36 134,46 142,46" fill="#A8B8C4"/>
  <!-- Crossguard -->
  <rect x="128" y="134" width="32" height="8" fill="#C49A28" rx="2"/>
  <!-- Crossguard detail -->
  <circle cx="128" cy="138" r="4" fill="#A07820"/>
  <circle cx="160" cy="138" r="4" fill="#A07820"/>
  <!-- Grip -->
  <rect x="140" y="142" width="12" height="44" fill="#5C3317" rx="3"/>
  <!-- Grip wrap -->
  <line x1="140" y1="152" x2="152" y2="152" stroke="#3B2A1A" stroke-width="2"/>
  <line x1="140" y1="160" x2="152" y2="160" stroke="#3B2A1A" stroke-width="2"/>
  <line x1="140" y1="168" x2="152" y2="168" stroke="#3B2A1A" stroke-width="2"/>
  <line x1="140" y1="176" x2="152" y2="176" stroke="#3B2A1A" stroke-width="2"/>
  <!-- Pommel -->
  <circle cx="146" cy="188" r="8" fill="#C49A28"/>
  <circle cx="146" cy="188" r="4" fill="#8B6914"/>
</svg>
