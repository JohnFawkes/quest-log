<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <g transform="translate(0,36)">
  <!-- Kite Shield - shifted x+20, y-30 so arm strap aligns with left arm (x=54) -->
  <!-- Shield shape -->
  <path d="M40 105 L104 105 L104 165 Q104 200 72 218 Q40 200 40 165 Z" fill="#1A3A6B"/>
  <!-- Heraldic division (quarterly) -->
  <path d="M72 105 L72 218 M40 162 L104 162" stroke="#FFD700" stroke-width="3"/>
  <!-- Top-left quarter (red) -->
  <path d="M40 105 L72 105 L72 162 L40 162 Z" fill="#C0392B"/>
  <!-- Bottom-right quarter (red) -->
  <path d="M72 162 L104 162 L104 165 Q104 200 72 218 L72 162 Z" fill="#C0392B"/>
  <!-- Lion/emblem in top-right -->
  <text x="76" y="142" font-size="20" fill="#FFD700">♞</text>
  <!-- Fleur in bottom-left -->
  <text x="44" y="198" font-size="16" fill="#FFD700" opacity="0.9">⚜</text>
  <!-- Gold border -->
  <path d="M40 105 L104 105 L104 165 Q104 200 72 218 Q40 200 40 165 Z" fill="none" stroke="#FFD700" stroke-width="4"/>
  <!-- Center boss -->
  <circle cx="72" cy="162" r="6" fill="#FFD700"/>
  <circle cx="72" cy="162" r="3" fill="#C49A28"/>
  <!-- Arm strap (x range 48-58, aligns with left arm x=54-73) -->
  <path d="M58 125 Q48 155 58 185" stroke="#3B2A1A" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Shield shine -->
  <path d="M44 112 Q60 106 76 110" stroke="#4A6ABA" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>
</svg>
