<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <g transform="translate(0,36)">
  <!-- Plain Tunic - starter -->
  <!-- Torso -->
  <rect x="72" y="67" width="56" height="74" fill="#8B7355" rx="4"/>
  <!-- Left sleeve -->
  <rect x="54" y="69" width="19" height="56" fill="#8B7355" rx="4"/>
  <!-- Right sleeve -->
  <rect x="127" y="69" width="19" height="56" fill="#8B7355" rx="4"/>
  <!-- Collar V-neck -->
  <path d="M92 67 L100 80 L108 67" fill="#7A6347" stroke="#6A5337" stroke-width="1"/>
  <!-- Lace ties on collar -->
  <line x1="96" y1="68" x2="96" y2="76" stroke="#6A5337" stroke-width="1"/>
  <line x1="104" y1="68" x2="104" y2="76" stroke="#6A5337" stroke-width="1"/>
  <!-- Tunic hem -->
  <rect x="72" y="133" width="56" height="8" fill="#7A6347" rx="2"/>
  <!-- Belt area -->
  <rect x="70" y="136" width="60" height="9" fill="#3B2A1A" rx="3"/>
  <rect x="97" y="136" width="6" height="9" fill="#C8A020"/>
  <!-- Sleeve cuffs -->
  <rect x="54" y="116" width="19" height="6" fill="#7A6347" rx="2"/>
  <rect x="127" y="116" width="19" height="6" fill="#7A6347" rx="2"/>
  <!-- Simple stitch line -->
  <path d="M72 95 L128 95" stroke="#7A6347" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  </g>
</svg>
