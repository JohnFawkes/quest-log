<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <g transform="translate(0,36)">
  <!-- Wizard Robe -->
  <!-- Main robe body -->
  <rect x="70" y="67" width="60" height="80" fill="#2C1670" rx="4"/>
  <!-- Robe flare at bottom -->
  <path d="M70 140 L60 270 L140 270 L130 140 Z" fill="#2C1670"/>
  <!-- Sleeves — moderately flared, mid-forearm length -->
  <path d="M72 70 L56 70 L40 84 L44 106 L58 110 L72 100 L72 70 Z" fill="#2C1670"/>
  <path d="M128 70 L144 70 L160 84 L156 106 L142 110 L128 100 L128 70 Z" fill="#2C1670"/>
  <!-- Robe trim (gold) -->
  <path d="M70 67 Q100 62 130 67" stroke="#FFD700" stroke-width="3" fill="none"/>
  <line x1="70" y1="140" x2="130" y2="140" stroke="#FFD700" stroke-width="2"/>
  <!-- Sleeve trim (outer edge of each sleeve) -->
  <path d="M40 84 L44 106" stroke="#FFD700" stroke-width="2" fill="none"/>
  <path d="M160 84 L156 106" stroke="#FFD700" stroke-width="2" fill="none"/>
  <!-- Hem trim -->
  <path d="M60 270 L140 270" stroke="#FFD700" stroke-width="2.5"/>
  <!-- Star pattern on robe -->
  <text x="84" y="100" font-size="12" fill="#9B59B6" opacity="0.8">✦</text>
  <text x="106" y="88" font-size="9" fill="#9B59B6" opacity="0.7">✦</text>
  <text x="95" y="115" font-size="8" fill="#6B2D8B" opacity="0.6">★</text>
  <!-- Belt/sash -->
  <rect x="70" y="136" width="60" height="10" fill="#6B2D8B" rx="3"/>
  <path d="M100 136 L96 154 L100 156 L104 154 L100 136" fill="#FFD700"/>
  <!-- Collar -->
  <path d="M84 67 L100 78 L116 67" fill="#3B1F8C" stroke="#FFD700" stroke-width="1"/>
  </g>
</svg>
