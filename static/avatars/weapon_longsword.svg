<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <!-- Great Two-Handed Longsword - grip at right hand (cy≈164) -->
  <!-- Blade (wide, tip clips above canvas) -->
  <path d="M155 208 L120 -22" stroke="#C0CDD3" stroke-width="10" stroke-linecap="round"/>
  <!-- Blade fuller groove -->
  <path d="M154 206 L120 -18" stroke="#8898A8" stroke-width="2" opacity="0.5"/>
  <!-- Blade edge highlight -->
  <path d="M158 206 L124 -22" stroke="#E8F0F5" stroke-width="2" opacity="0.6"/>
  <!-- Blade tip -->
  <polygon points="120,-22 114,-8 126,-8" fill="#A8B8C4"/>
  <!-- Crossguard (large) -->
  <rect x="106" y="138" width="44" height="10" fill="#C49A28" rx="3"/>
  <!-- Crossguard points -->
  <polygon points="106,143 98,143 100,136 108,138" fill="#A07820"/>
  <polygon points="150,143 158,143 156,136 148,138" fill="#A07820"/>
  <!-- Grip (long, two-handed) -->
  <rect x="122" y="148" width="14" height="54" fill="#3B2A1A" rx="3"/>
  <!-- Grip wrap leather -->
  <rect x="122" y="148" width="14" height="4" fill="#6B4226"/>
  <rect x="122" y="156" width="14" height="4" fill="#6B4226"/>
  <rect x="122" y="164" width="14" height="4" fill="#6B4226"/>
  <rect x="122" y="172" width="14" height="4" fill="#6B4226"/>
  <rect x="122" y="180" width="14" height="4" fill="#6B4226"/>
  <rect x="122" y="188" width="14" height="4" fill="#6B4226"/>
  <!-- Pommel (ornate) -->
  <ellipse cx="129" cy="205" rx="11" ry="8" fill="#C49A28"/>
  <circle cx="129" cy="205" r="5" fill="#8B6914"/>
  <circle cx="129" cy="205" r="2.5" fill="#FFD700"/>
</svg>
