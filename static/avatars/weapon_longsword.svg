<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <!-- Great Two-Handed Longsword - straight vertical, grip at right hand (cy≈164) -->
  <!-- Blade (wide, long - top clips above canvas) -->
  <rect x="141" y="8" width="10" height="132" fill="#C0CDD3" rx="3"/>
  <!-- Blade fuller groove (centre channel) -->
  <rect x="145" y="12" width="3" height="124" fill="#8898A8" rx="1" opacity="0.5"/>
  <!-- Blade edge highlight -->
  <rect x="150" y="10" width="2" height="128" fill="#E8F0F5" rx="1" opacity="0.6"/>
  <!-- Blade tip -->
  <polygon points="141,8 151,8 146,-6" fill="#A8B8C4"/>
  <!-- Crossguard (large, wide) -->
  <rect x="106" y="140" width="80" height="10" fill="#C49A28" rx="3"/>
  <!-- Crossguard end ornaments -->
  <ellipse cx="106" cy="145" rx="7" ry="6" fill="#A07820"/>
  <ellipse cx="186" cy="145" rx="7" ry="6" fill="#A07820"/>
  <!-- Grip (long, two-handed) - centred on blade -->
  <rect x="140" y="150" width="12" height="56" fill="#3B2A1A" rx="3"/>
  <!-- Grip leather wrap bands -->
  <rect x="140" y="154" width="12" height="4" fill="#6B4226"/>
  <rect x="140" y="162" width="12" height="4" fill="#6B4226"/>
  <rect x="140" y="170" width="12" height="4" fill="#6B4226"/>
  <rect x="140" y="178" width="12" height="4" fill="#6B4226"/>
  <rect x="140" y="186" width="12" height="4" fill="#6B4226"/>
  <rect x="140" y="194" width="12" height="4" fill="#6B4226"/>
  <!-- Pommel (ornate) -->
  <ellipse cx="146" cy="212" rx="12" ry="9" fill="#C49A28"/>
  <circle cx="146" cy="212" r="5" fill="#8B6914"/>
  <circle cx="146" cy="212" r="2.5" fill="#FFD700"/>
</svg>
