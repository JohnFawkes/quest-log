<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <g transform="translate(0,36)">
  <!-- Lit Torch - handle grip at left hand (cy≈164) -->
  <!-- Handle -->
  <rect x="46" y="115" width="12" height="110" fill="#5C3317" rx="4"/>
  <!-- Handle grip wrapping -->
  <rect x="46" y="125" width="12" height="5" fill="#3B2A1A"/>
  <rect x="46" y="140" width="12" height="5" fill="#3B2A1A"/>
  <rect x="46" y="155" width="12" height="5" fill="#3B2A1A"/>
  <rect x="46" y="170" width="12" height="5" fill="#3B2A1A"/>
  <!-- Torch head -->
  <rect x="42" y="90" width="20" height="30" fill="#6B4226" rx="3"/>
  <!-- Wrapping/binding -->
  <line x1="42" y1="98" x2="62" y2="98" stroke="#3B2A1A" stroke-width="2"/>
  <line x1="42" y1="106" x2="62" y2="106" stroke="#3B2A1A" stroke-width="2"/>
  <!-- Flame (animated glow using layers) -->
  <!-- Outer flame glow -->
  <ellipse cx="52" cy="78" rx="18" ry="22" fill="#FF6B35" opacity="0.3"/>
  <!-- Main flame shape -->
  <path d="M40 95 Q42 78 52 65 Q62 78 64 95" fill="#FF8C00"/>
  <!-- Inner flame -->
  <path d="M44 95 Q46 82 52 72 Q58 82 60 95" fill="#FFA500"/>
  <!-- Hot core -->
  <path d="M47 95 Q49 85 52 78 Q55 85 57 95" fill="#FFD700"/>
  <!-- White hot tip -->
  <ellipse cx="52" cy="78" rx="4" ry="6" fill="#FFFACD" opacity="0.8"/>
  <!-- Flame sparkles -->
  <circle cx="44" cy="74" r="2" fill="#FF6B35" opacity="0.6"/>
  <circle cx="60" cy="70" r="2" fill="#FF6B35" opacity="0.5"/>
  <circle cx="48" cy="65" r="1.5" fill="#FFA500" opacity="0.5"/>
  <!-- Smoke wisps -->
  <path d="M52 63 Q48 54 52 46 Q56 52 52 60" stroke="#888" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M52 63 Q55 50 58 45" stroke="#888" stroke-width="1" fill="none" opacity="0.2"/>
  </g>
</svg>
