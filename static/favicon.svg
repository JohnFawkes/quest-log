<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Chest base -->
  <rect x="3" y="16" width="26" height="13" rx="2" fill="#92400e"/>
  <rect x="3" y="16" width="26" height="13" rx="2" fill="url(#woodgrain)" opacity="0.3"/>
  <!-- Chest lid -->
  <rect x="3" y="7" width="26" height="11" rx="2" fill="#b45309"/>
  <!-- Lid arc highlight -->
  <rect x="4" y="8" width="24" height="4" rx="1" fill="#d97706" opacity="0.5"/>
  <!-- Metal bands on lid -->
  <rect x="3" y="14" width="26" height="2" fill="#78350f"/>
  <!-- Metal bands on base -->
  <rect x="3" y="22" width="26" height="2" fill="#78350f"/>
  <!-- Corner studs lid -->
  <rect x="4" y="8" width="3" height="3" rx="0.5" fill="#d97706"/>
  <rect x="25" y="8" width="3" height="3" rx="0.5" fill="#d97706"/>
  <!-- Corner studs base -->
  <rect x="4" y="23" width="3" height="3" rx="0.5" fill="#d97706"/>
  <rect x="25" y="23" width="3" height="3" rx="0.5" fill="#d97706"/>
  <!-- Lock plate -->
  <rect x="13" y="13" width="6" height="6" rx="1" fill="#d97706"/>
  <!-- Keyhole -->
  <circle cx="16" cy="16" r="1.5" fill="#78350f"/>
  <rect x="15" y="17" width="2" height="2" rx="0.3" fill="#78350f"/>
  <!-- Gold glint from inside (peeking) -->
  <rect x="5" y="17" width="22" height="1" fill="#fbbf24" opacity="0.4"/>
</svg>
