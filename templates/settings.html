{% extends "layout.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 overflow-hidden">
        <div class="p-6 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
            <h1 class="text-2xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                <i class="fas fa-user-cog text-indigo-500"></i> Adventurer Settings
            </h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm">Customize your journey.</p>
        </div>
        
        <form method="POST" action="{{ url_for('settings_profile') }}" class="p-6 space-y-8">
            
            <!-- Display Name -->
            <div>
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Display Name</label>
                <input type="text" name="name" value="{{ current_user.name }}" required 
                    class="w-full p-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white">
                <p class="text-xs text-slate-500 mt-1">How you appear in the guild hall.</p>
            </div>

            <!-- Theme Selection -->
            <div>
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-4">Select Theme</label>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    
                    <!-- Dark (Default) -->
                    <label class="relative cursor-pointer group">
                        <input type="radio" name="theme" value="dark" class="peer sr-only" {% if current_user.theme == 'dark' %}checked{% endif %}>
                        <div class="p-4 rounded-lg border-2 border-slate-200 dark:border-slate-700 peer-checked:border-indigo-500 peer-checked:bg-slate-50 dark:peer-checked:bg-slate-700 transition hover:border-indigo-300">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center text-white">
                                    <i class="fas fa-moon"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-slate-800 dark:text-white">Dungeon (Default)</h3>
                                    <p class="text-xs text-slate-500">Dark mode for deep delving.</p>
                                </div>
                            </div>
                        </div>
                    </label>

                    <!-- Light -->
                    <label class="relative cursor-pointer group">
                        <input type="radio" name="theme" value="light" class="peer sr-only" {% if current_user.theme == 'light' %}checked{% endif %}>
                        <div class="p-4 rounded-lg border-2 border-slate-200 dark:border-slate-700 peer-checked:border-indigo-500 peer-checked:bg-slate-50 dark:peer-checked:bg-slate-700 transition hover:border-indigo-300">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-800">
                                    <i class="fas fa-sun"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-slate-800 dark:text-white">Town Square</h3>
                                    <p class="text-xs text-slate-500">Bright and airy.</p>
                                </div>
                            </div>
                        </div>
                    </label>

                    <!-- Princess -->
                    <label class="relative cursor-pointer group">
                        <input type="radio" name="theme" value="princess" class="peer sr-only" {% if current_user.theme == 'princess' %}checked{% endif %}>
                        <div class="p-4 rounded-lg border-2 border-slate-200 dark:border-slate-700 peer-checked:border-pink-500 peer-checked:bg-pink-50 dark:peer-checked:bg-slate-700 transition hover:border-pink-300">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-pink-100 border border-pink-200 flex items-center justify-center text-pink-600">
                                    <i class="fas fa-crown"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-slate-800 dark:text-white">Royal Court</h3>
                                    <p class="text-xs text-slate-500">Pink and elegant.</p>
                                </div>
                            </div>
                        </div>
                    </label>

                    <!-- Forest -->
                    <label class="relative cursor-pointer group">
                        <input type="radio" name="theme" value="forest" class="peer sr-only" {% if current_user.theme == 'forest' %}checked{% endif %}>
                        <div class="p-4 rounded-lg border-2 border-slate-200 dark:border-slate-700 peer-checked:border-green-500 peer-checked:bg-green-50 dark:peer-checked:bg-slate-700 transition hover:border-green-300">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-green-100 border border-green-200 flex items-center justify-center text-green-700">
                                    <i class="fas fa-tree"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-slate-800 dark:text-white">Ranger's Lodge</h3>
                                    <p class="text-xs text-slate-500">Natural greens.</p>
                                </div>
                            </div>
                        </div>
                    </label>

                </div>
            </div>

            <div class="pt-4 border-t border-slate-200 dark:border-slate-700">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition transform hover:-translate-y-0.5">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
