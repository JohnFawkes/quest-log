{% extends "layout.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-slate-800 p-8 rounded-xl shadow-xl mt-10 border border-indigo-50 dark:border-slate-700">
    <div class="text-center mb-6">
        <div class="inline-block p-4 bg-amber-100 dark:bg-slate-700 rounded-full mb-4">
            <i class="fas fa-key text-4xl text-amber-600 dark:text-amber-400"></i>
        </div>
        <h1 class="text-3xl font-black text-slate-800 dark:text-slate-100">Change Password</h1>
        <p class="text-slate-500 dark:text-slate-400 mt-2 text-sm">Your password has been reset by an admin. Please choose a new password to continue.</p>
    </div>

    <form method="POST" action="{{ url_for('change_password') }}" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-slate-700 dark:text-slate-300 text-xs font-bold uppercase tracking-wider mb-2" for="cp-password">New Password</label>
            <input type="password" name="password" id="cp-password" required minlength="4"
                class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition dark:text-white">
        </div>
        <div>
            <label class="block text-slate-700 dark:text-slate-300 text-xs font-bold uppercase tracking-wider mb-2" for="cp-confirm">Confirm Password</label>
            <input type="password" name="confirm_password" id="cp-confirm" required minlength="4"
                class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition dark:text-white">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition transform hover:-translate-y-0.5">
            Set New Password
        </button>
    </form>
</div>
{% endblock %}
