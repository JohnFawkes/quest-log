{% extends "layout.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-slate-800 p-8 rounded-lg shadow-lg mt-10 border border-slate-200 dark:border-slate-700">
    <h1 class="text-3xl font-bold text-center mb-6 text-slate-800 dark:text-slate-100">Create Account</h1>
    
    <form method="POST" action="{{ url_for('register') }}">
        <div class="mb-4">
            <label class="block text-gray-700 dark:text-slate-300 text-sm font-bold mb-2" for="name">Display Name</label>
            <input type="text" name="name" id="name" required placeholder="John Doe"
                class="shadow appearance-none border dark:border-slate-700 rounded w-full py-2 px-3 text-gray-700 dark:text-slate-200 bg-white dark:bg-slate-900 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-emerald-500">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 dark:text-slate-300 text-sm font-bold mb-2" for="email">Email</label>
            <input type="email" name="email" id="email" required placeholder="you@example.com"
                class="shadow appearance-none border dark:border-slate-700 rounded w-full py-2 px-3 text-gray-700 dark:text-slate-200 bg-white dark:bg-slate-900 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-emerald-500">
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 dark:text-slate-300 text-sm font-bold mb-2" for="password">Password</label>
            <input type="password" name="password" id="password" required 
                class="shadow appearance-none border dark:border-slate-700 rounded w-full py-2 px-3 text-gray-700 dark:text-slate-200 bg-white dark:bg-slate-900 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-emerald-500">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition transform hover:-translate-y-0.5">
            Create Account
        </button>
    </form>
    
    <div class="mt-6 text-center border-t border-slate-200 dark:border-slate-700 pt-6">
        <p class="text-gray-600 dark:text-slate-400 text-sm">Already have an account? <a href="{{ url_for('login') }}" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 font-bold">Login here</a></p>
    </div>
</div>
{% endblock %}
