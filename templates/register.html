{% extends "layout.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-slate-800 p-8 rounded-xl shadow-xl mt-10 border border-indigo-50 dark:border-slate-700">
    <div class="text-center mb-8">
        <div class="inline-block p-4 bg-emerald-100 dark:bg-slate-700 rounded-full mb-4">
            <i class="fas fa-user-plus text-4xl text-emerald-600 dark:text-emerald-400"></i>
        </div>
        <h1 class="text-3xl font-black text-slate-800 dark:text-slate-100">Join QuestLog</h1>
        <p class="text-slate-500 dark:text-slate-400 mt-2">Create your adventurer profile.</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-slate-700 dark:text-slate-300 text-xs font-bold uppercase tracking-wider mb-2" for="name">Display Name</label>
            <input type="text" name="name" id="name" required placeholder="John Doe"
                class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 transition dark:text-white">
        </div>
        <div>
            <label class="block text-slate-700 dark:text-slate-300 text-xs font-bold uppercase tracking-wider mb-2" for="email">Email</label>
            <input type="email" name="email" id="email" required placeholder="you@example.com"
                class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 transition dark:text-white">
        </div>
        <div>
            <label class="block text-slate-700 dark:text-slate-300 text-xs font-bold uppercase tracking-wider mb-2" for="password">Password</label>
            <input type="password" name="password" id="password" required minlength="4"
                class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 transition dark:text-white">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition transform hover:-translate-y-0.5">
            Create Account
        </button>
    </form>

    <div class="mt-8 text-center border-t border-slate-200 dark:border-slate-700 pt-6">
        <p class="text-slate-500 dark:text-slate-400 text-sm">Already have an account? <a href="{{ url_for('login') }}" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 font-bold">Login here</a></p>
    </div>
</div>
{% endblock %}
