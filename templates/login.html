{% extends "layout.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-slate-800 p-8 rounded-xl shadow-xl mt-10 border border-indigo-50 dark:border-slate-700">
    <div class="text-center mb-8">
        <div class="inline-block p-4 bg-indigo-100 dark:bg-slate-700 rounded-full mb-4">
            <i class="fas fa-dungeon text-4xl text-indigo-600 dark:text-indigo-400"></i>
        </div>
        <h1 class="text-3xl font-black text-slate-800 dark:text-slate-100">Enter QuestLog</h1>
        <p class="text-slate-500 dark:text-slate-400 mt-2">Log your adventures. Earn Gems. Level Up.</p>
    </div>
    
    <!-- Local Login Form -->
    <form method="POST" action="{{ url_for('login') }}" class="mb-6 space-y-4">
        <div>
            <label class="block text-slate-700 dark:text-slate-300 text-xs font-bold uppercase tracking-wider mb-2" for="email">Username / Email</label>
            <input type="text" name="email" id="email" required 
                class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition dark:text-white">
        </div>
        <div>
            <label class="block text-slate-700 dark:text-slate-300 text-xs font-bold uppercase tracking-wider mb-2" for="password">Password</label>
            <input type="password" name="password" id="password" required 
                class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition dark:text-white">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition transform hover:-translate-y-0.5">
            Begin Adventure
        </button>
    </form>
    
    <div class="relative flex py-2 items-center mb-6">
        <div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
        <span class="flex-shrink mx-4 text-slate-400 text-sm font-medium">OR</span>
        <div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
    </div>

    <div class="space-y-3">
        <!-- Google Login -->
        <a href="{{ url_for('google_login') }}" class="block w-full bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 font-bold py-3 px-4 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-600 flex items-center justify-center transition">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5 mr-3">
            Continue with Google
        </a>

        <!-- Demo Login -->
        <a href="{{ url_for('login_demo') }}" class="block w-full bg-amber-50 dark:bg-amber-900/20 border border-amber-300 dark:border-amber-700/50 text-amber-800 dark:text-amber-200 font-bold py-3 px-4 rounded-lg hover:bg-amber-100 dark:hover:bg-amber-900/30 flex items-center justify-center transition">
            <i class="fas fa-user-secret mr-3"></i> Try Demo Account
        </a>
    </div>

    <div class="mt-8 text-center border-t border-slate-200 dark:border-slate-700 pt-6">
        <p class="text-slate-500 dark:text-slate-400 text-sm">New adventurer? <a href="{{ url_for('register') }}" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 font-bold">Create Profile</a></p>
    </div>
</div>
{% endblock %}
