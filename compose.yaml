services:
  questlog:
    image: ghcr.io/johnfawkes/quest-log:latest
    restart: always
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      # Persist the database file
      - ./data:/data
      # Persist user uploaded images
      - ./static/uploads:/app/static/uploads
      # Persist daily database backups
      - ./backups:/backups
    environment:
      # These variables are read from your .env file
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-prod}
      - DATA_DIR=/data
      - PORT=${PORT:-5000}
      - TZ=${TZ:-UTC}
      - APPRISE_URLS=${APPRISE_URLS}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-http://localhost:5000}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:$${PORT:-5000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
