services:
  web:
    image: ghcr.io/johnfawkes/quest-log:pr-7
    restart: always
    ports:
      - "5000:5000"
    volumes:
      # Persist the database file
      - ./data:/data
      # Persist user uploaded images
      - ./static/uploads:/app/static/uploads
    environment:
      # These variables are read from your .env file
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-prod}
      - DATA_DIR=/data
      - APPRISE_URLS=${APPRISE_URLS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-http://localhost:5000}
