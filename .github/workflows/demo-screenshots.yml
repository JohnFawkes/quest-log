name: Demo Screenshots

on:
  push:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full ref so we can push back to the same branch
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: quest-log:screenshot
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d -p 5000:5000 --name app \
            -e SECRET_KEY=screenshot-run-secret \
            quest-log:screenshot

      - name: Wait for app to be ready
        run: |
          echo "Waiting for app..."
          for i in {1..15}; do
            if curl -sf http://localhost:5000/health; then
              echo "App is ready."
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Take demo screenshots
        run: |
          python3 - <<'EOF'
          import asyncio
          from playwright.async_api import async_playwright

          BASE = "http://localhost:5000"

          PAGES = [
              ("quests",    "/"),
              ("rewards",   "/rewards"),
              ("avatar",    "/avatar"),
              ("settings",  "/settings/profile"),
          ]

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  ctx = await browser.new_context(viewport={"width": 1280, "height": 900})
                  page = await ctx.new_page()

                  # Log in as the demo account
                  await page.goto(f"{BASE}/login/demo")
                  await page.wait_for_load_state("networkidle")

                  for name, path in PAGES:
                      await page.goto(f"{BASE}{path}")
                      await page.wait_for_load_state("networkidle")
                      out = f"screenshot-{name}.png"
                      await page.screenshot(path=out, full_page=True)
                      print(f"Saved {out}")

                  await browser.close()

          asyncio.run(main())
          EOF

      - name: Commit screenshots to repo
        run: |
          mkdir -p screenshots
          cp screenshot-*.png screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots/
          git diff --staged --quiet && echo "No changes to screenshots." || \
            git commit -m "chore: update demo screenshots [skip ci]" && \
            git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Upload screenshots as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-screenshots-${{ github.sha }}
          path: screenshots/
          retention-days: 30

      - name: Stop container
        if: always()
        run: docker rm -f app
