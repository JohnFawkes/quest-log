name: Build, Test, and Publish

# Trigger on Pull Requests (ignoring README)
# Also triggers on Push to main to ensure 'latest' tag is updated
on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "README.md" ]
  pull_request:
    paths-ignore: [ "README.md" ]

env:
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Fix for uppercase letters in repo names (Docker requires lowercase)
      - name: Lowercase Image Name
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >>${GITHUB_ENV}

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Automatically generate tags:
      # - PRs get: ghcr.io/owner/repo:pr-123
      # - Main gets: ghcr.io/owner/repo:latest
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      # Build and Load into local Docker daemon for testing
      - name: Build Docker image (Load Local)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Container for Testing
        run: |
          # Get the first tag generated by the metadata step
          TAGS="${{ steps.meta.outputs.tags }}"
          TEST_TAG=$(echo "$TAGS" | head -n 1)

          echo "Starting container with tag: $TEST_TAG"
          # Run disconnected (-d) mapped to port 5000
          docker run -d -p 5000:5000 --name test-container "$TEST_TAG"

      - name: Wait for container to start
        run: sleep 10

      - name: Test Homepage Availability
        run: |
          # Check URL. -L follows redirects (root -> /login).
          # -f fails on 404/500 errors.
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" -L http://localhost:5000)
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq "200" ]; then
            echo "✅ Test Passed: Website is up and accessible."
          else
            echo "❌ Test Failed: Website returned status $HTTP_STATUS"
            echo "--- Container Logs ---"
            docker logs test-container
            exit 1
          fi

      - name: Stop Test Container
        if: always()
        run: docker rm -f test-container

      # If tests passed, build again (cached) and push to registry
      - name: Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
