name: PR Build on Label

# Triggered when labels are added to a PR
on:
  pull_request:
    types: [labeled]

env:
  REGISTRY: ghcr.io

jobs:
  build-test:
    # Only run when BUILD or PUSH label is applied
    if: >
      github.event.label.name == 'BUILD' ||
      github.event.label.name == 'PUSH'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
      issues: write

    steps:
      - name: Determine build mode
        id: mode
        run: |
          LABEL="${{ github.event.label.name }}"
          echo "Label applied: $LABEL"
          if [ "$LABEL" = "PUSH" ]; then
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR branch
        uses: actions/checkout@v6

      - name: Set PR metadata
        id: pr
        run: |
          echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Lowercase Image Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=pr-${{ steps.pr.outputs.number }}
            type=raw,value=pr-${{ steps.pr.outputs.number }}-${{ steps.pr.outputs.sha }}

      - name: Build Docker image (Load Local)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Container for Testing
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          TEST_TAG=$(echo "$TAGS" | head -n 1)

          echo "Starting container with tag: $TEST_TAG"
          docker run -d -p 5000:5000 --name test-container "$TEST_TAG"

      - name: Wait for container to start (with retry)
        run: |
          echo "Waiting for service to be ready..."
          for i in {1..10}; do
            if curl -s -o /dev/null http://localhost:5000; then
              echo "Service is up!"
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done
          echo "Service failed to start in time."
          docker logs test-container
          exit 1

      - name: Test Homepage Availability
        run: |
          echo "Testing homepage access..."
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" -L http://localhost:5000)
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq "200" ]; then
            echo "Test Passed: Website is up and accessible."
          else
            echo "Test Failed: Website returned status $HTTP_STATUS"
            echo "--- Container Logs ---"
            docker logs test-container
            exit 1
          fi

      - name: Test Health Endpoint
        run: |
          echo "Testing /health endpoint..."
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" http://localhost:5000/health)
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq "200" ]; then
            echo "Test Passed: Health endpoint responding."
          else
            echo "Test Failed: Health endpoint returned status $HTTP_STATUS"
            docker logs test-container
            exit 1
          fi

      - name: Stop Test Container
        if: always()
        run: docker rm -f test-container

      # Push to registry only when PUSH label was used
      - name: Push Docker image
        if: steps.mode.outputs.should_push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Remove the label so it can be re-applied to trigger again
      - name: Remove trigger label
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const label = '${{ github.event.label.name }}';
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ steps.pr.outputs.number }},
                name: label
              });
            } catch (e) {
              console.log(`Label "${label}" already removed or not found.`);
            }

      - name: Comment result on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const pushed = '${{ steps.mode.outputs.should_push }}' === 'true';
            const sha = '${{ steps.pr.outputs.sha }}'.substring(0, 7);
            const image = '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ steps.pr.outputs.number }}';
            const label = '${{ github.event.label.name }}';

            let body;
            if (success) {
              body = `### ${label} ${pushed ? '& Push ' : ''}Successful\n\n`;
              body += `| | |\n|---|---|\n`;
              body += `| **Commit** | \`${sha}\` |\n`;
              body += `| **Status** | Passed |\n`;
              if (pushed) {
                body += `| **Image** | \`${image}\` |\n`;
                body += `\n\`\`\`bash\ndocker pull ${image}\n\`\`\`\n`;
              } else {
                body += `\n> Image was **not pushed**. Apply the \`PUSH\` label to build and push to the registry.\n`;
              }
            } else {
              body = `### ${label} Failed\n\n`;
              body += `| | |\n|---|---|\n`;
              body += `| **Commit** | \`${sha}\` |\n`;
              body += `| **Status** | Failed |\n`;
              body += `\nCheck the [workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}) for details.\n`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.number }},
              body: body
            });

  # One-time job to ensure the labels exist in the repo
  ensure-labels:
    if: >
      github.event.label.name == 'BUILD' ||
      github.event.label.name == 'PUSH'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create labels if missing
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'BUILD', color: '1d76db', description: 'Build and test Docker image from this PR' },
              { name: 'PUSH',  color: 'd93f0b', description: 'Build, test, and push Docker image from this PR' }
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                  console.log(`Created label: ${label.name}`);
                }
              }
            }
